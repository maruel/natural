# References:
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://help.github.com/en/actions/configuring-and-managing-workflows/authenticating-with-the-github_token#using-the-github_token-in-a-workflow
# https://help.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions/
# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# https://docs.github.com/en/rest/commits/comments#create-a-commit-comment
# https://docs.github.com/en/developers/webhooks-and-events/webhooks/webhook-events-and-payloads#pull_request
# https://docs.github.com/en/actions/learn-github-actions/contexts

on: [push, pull_request]
name: Run tests
jobs:
  # Portable runtime checks run on Ubuntu.
  check:
    name: Check
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: x
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-go@v7
        with:
          # Do not forget to bump every 6 months!
          go-version: "~1.25.0"
      - name: "go install necessary tools"
        if: always()
        run: |
          go install github.com/maruel/pat/cmd/ba@v0.0.4
      - name: "Check: go test -cover"
        if: always()
        run: make test
        # Don't send code coverage if anything failed to reduce spam.
      - uses: codecov/codecov-action@v7
      - name: "Cleanup"
        if: always()
        run: rm coverage.txt
      - name: "Check: go test -race"
        run: make test-race
      - name: "Check: benchmark 📈"
        run: ba -against HEAD~1
      - name: "Check: tree is clean"
        if: always()
        run: |
          # Nothing should have changed in the tree up to that point and no
          # unsuspected file was created.
          TOUCHED=$(git status --porcelain --ignored -- . \
            ':(exclude).venv' ':(exclude).ruff_cache' \
            ':(top,exclude,literal)coverage.txt' ':(top,exclude,literal)codecov' \
            ':(top,exclude,literal)codecov.SHA256SUM' ':(top,exclude,literal)codecov.SHA256SUM.sig' \
            ':(top,exclude,literal)codecov.exe' ':(top,exclude,literal)codecov.exe.SHA256SUM' \
            ':(top,exclude,literal)codecov.exe.SHA256SUM.sig')
          if ! test -z "$TOUCHED"; then
            echo "Oops, something touched these files, please cleanup:"
            echo "$TOUCHED"
            git diff
            false
          fi
      - name: Set up static-check Go toolchain
        if: always()
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Static checks
        if: always()
        run: make verify
      - name: "Check: go generate doesn't modify files"
        if: always()
        run: |
          go generate ./...
          # Also test for untracked files. go generate should not generate ignored
          # files either.
          TOUCHED=$(git status --porcelain --ignored -- . \
            ':(exclude).venv' ':(exclude).ruff_cache' \
            ':(top,exclude,literal)coverage.txt' ':(top,exclude,literal)codecov' \
            ':(top,exclude,literal)codecov.SHA256SUM' ':(top,exclude,literal)codecov.SHA256SUM.sig' \
            ':(top,exclude,literal)codecov.exe' ':(top,exclude,literal)codecov.exe.SHA256SUM' \
            ':(top,exclude,literal)codecov.exe.SHA256SUM.sig')
          if ! test -z "$TOUCHED"; then
            echo "go generate created these files, please fix:"
            echo "$TOUCHED"
            false
          fi

  codeql:
    name: "codeql: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
